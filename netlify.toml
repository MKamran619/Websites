# Netlify Configuration for SEO Optimization

[build]
  command = "npm install && npm run build"
  publish = "dist/websites/browser"
  [build.environment]
    NPM_CONFIG_PRODUCTION = "false"
  # Netlify's "Pretty URLs" post-processing was 301-redirecting every
  # non-homepage route (e.g. /about -> /about/) before serving it, and
  # appears to also be what was intercepting unknown paths ahead of the
  # site's own 404.html (see LIVE_POST_DEPLOYMENT_SEO_VALIDATION.md).
  # Every real route is already its own prerendered index.html at its exact
  # sitemap/canonical URL, so no post-processing rewrite is needed here -
  # disabling it should make /about (no trailing slash) serve 200 directly
  # and let unmatched paths fall through to a real 404 correctly. If this
  # setting is also toggled on in the Netlify dashboard (Site settings ->
  # Build & deploy -> Post processing -> Pretty URLs), that takes precedence
  # over this file and needs to be turned off there too.
  [build.processing.html]
    pretty_urls = false

# Redirects for SEO and UX
#
# The blanket `/* -> /index.html status=200` SPA-fallback rewrite that used
# to live here has been removed. It made every URL on the domain - typos,
# old links, bots probing for /wp-admin, literally anything - return HTTP
# 200 with the homepage's content (a "soft 404" that actively hurts SEO and
# that Search Console flags). It's no longer needed: every real route
# (including every individual /blog/:slug article) is now its own
# prerendered index.html file at build time (see angular.json's
# build.options.prerender + prerender-routes.txt), and Netlify serves those
# "pretty URL" style automatically. Any path that matches neither a redirect
# below nor an actual prerendered file now correctly falls through to
# public/404.html with a real HTTP 404 status - Netlify's standard
# static-site 404 convention, no custom rewrite required.

# HTTP to HTTPS redirect
[[redirects]]
  from = "http://nexawebservice.com/*"
  to = "https://nexawebservice.com/:splat"
  status = 301

# WWW to non-WWW redirect
[[redirects]]
  from = "https://www.nexawebservice.com/*"
  to = "https://nexawebservice.com/:splat"
  status = 301

# Redirect old portfolio URLs (if any)
[[redirects]]
  from = "/projects"
  to = "/portfolio"
  status = 301

[[redirects]]
  from = "/work"
  to = "/portfolio"
  status = 301

# Security Headers for SEO and Protection
[[headers]]
  for = "/*"
  [headers.values]
    # Security Headers
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Scoped to the real third-party origins this app uses: Supabase (all
    # page content), EmailJS (contact/newsletter forms), Google Fonts, GA4 +
    # Google Tag Manager, and the Meta/Facebook Pixel. 'unsafe-inline' is
    # kept for script-src/style-src rather than attempting a nonce/hash-based
    # policy - this app has several legitimate inline <script>/<style> blocks
    # (the analytics/consent-banner loader, Angular's per-component styles,
    # critical CSS) and locking those down safely would need a much larger,
    # riskier refactor. The real, meaningful protection this adds is
    # preventing arbitrary *external* script/connection origins beyond the
    # ones explicitly listed - it was entirely absent before.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.facebook.com https://www.google-analytics.com; connect-src 'self' https://enijmkzmranhirwajvms.supabase.co https://api.emailjs.com https://www.google-analytics.com https://www.googletagmanager.com https://connect.facebook.net; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
    
    # Performance & Caching
    Cache-Control = "public, max-age=3600, must-revalidate"
    
    # SEO Headers
    Content-Language = "en-US"
    
    # CORS for API calls
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    # NOTE: a `Link: rel=preconnect` header used to live here, preconnecting
    # to `/assets/fonts/` (same-origin - a no-op, already connected) and
    # `cdn.jsdelivr.net` (not referenced anywhere in the app at all - dead
    # weight). Lighthouse flagged this site for having more than 4
    # preconnect hints in total; removing this cut it back to the 2 that
    # are actually used (Google Fonts, in index.html).

# Cache static assets longer
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache index.html minimally for updates
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# JSON and XML sitemap cache
[[headers]]
  for = "/*.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=86400"

# Text file caching
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
    Cache-Control = "public, max-age=604800"

# Context-specific settings for production
[context.production]
  environment = { NODE_ENV = "production", HUGO_ENV = "production" }

[context.deploy-preview]
  environment = { NODE_ENV = "development" }

[context.branch-deploy]
  environment = { NODE_ENV = "development" }

# Form processing (if using Netlify Forms)
[[headers]]
  for = "/contact"
  [headers.values]
    Cache-Control = "public, max-age=300"
