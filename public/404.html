<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Page Not Found | Nexa Web Service</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <!--
      Netlify serves this file, from the publish directory root, with a real
      HTTP 404 status for any request that matches no redirect rule and no
      existing file - that's a static-hosting convention, not an Angular one.
      It has to be plain, self-contained HTML (no reference to a hashed
      styles.*.css bundle filename, which changes every build) since it's
      served directly rather than through the Angular app. Client-side
      navigation to a bad in-app route instead shows NotFoundComponent
      (src/app/pages/not-found/not-found.component.ts), which matches the
      rest of the site's design system. See
      TECHNICAL_SEO_IMPLEMENTATION_REPORT.md.
    -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0f1a;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
        text-align: center;
      }
      main {
        max-width: 34rem;
        padding: 2rem;
      }
      .code {
        font-size: 5rem;
        font-weight: 800;
        margin: 0;
        background: linear-gradient(135deg, #0066ff 0%, #00d4aa 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      h1 {
        margin: 0.5rem 0 1rem;
        font-size: 1.5rem;
      }
      p {
        color: #94a3b8;
        margin-bottom: 2rem;
      }
      a.btn {
        display: inline-block;
        padding: 0.75rem 1.75rem;
        border-radius: 9999px;
        background: #0066ff;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        margin: 0 0.5rem 0.5rem;
      }
      a.link {
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Page Not Found</h1>
      <p>The page you're looking for doesn't exist or may have moved.</p>
      <a class="btn" href="/">Back to Home</a>
      <p>
        <a class="link" href="/services">Services</a> ·
        <a class="link" href="/portfolio">Case Studies</a> ·
        <a class="link" href="/blog">Insights</a> ·
        <a class="link" href="/contact">Contact</a>
      </p>
    </main>
  </body>
</html>
