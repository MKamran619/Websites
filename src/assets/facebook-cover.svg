<svg width="1640" height="624" viewBox="0 0 1640 624" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="sloganGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f8ef7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="iconGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1640" height="624" fill="url(#bgGrad)"/>

  <!-- Subtle gradient orbs -->
  <circle cx="0" cy="0" r="420" fill="#4f8ef7" opacity="0.06"/>
  <circle cx="1640" cy="624" r="480" fill="#4f8ef7" opacity="0.07"/>
  <circle cx="1640" cy="0" r="260" fill="#60a5fa" opacity="0.04"/>
  <circle cx="820" cy="312" r="340" fill="#4f8ef7" opacity="0.025"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="208" x2="1640" y2="208" stroke="#4f8ef7" stroke-width="0.5" opacity="0.06"/>
  <line x1="0" y1="416" x2="1640" y2="416" stroke="#4f8ef7" stroke-width="0.5" opacity="0.06"/>
  <line x1="546" y1="0" x2="546" y2="624" stroke="#4f8ef7" stroke-width="0.5" opacity="0.06"/>
  <line x1="1093" y1="0" x2="1093" y2="624" stroke="#4f8ef7" stroke-width="0.5" opacity="0.06"/>

  <!-- ─── Icon block (right-center area, safe from profile overlap) ─── -->
  <!-- Profile pic overlaps bottom-left, so icon goes right side -->
  <g transform="translate(1140, 160)" filter="url(#iconGlow)">
    <!-- Background rounded square -->
    <rect x="0" y="0" width="220" height="220" rx="52" fill="url(#iconBg)"/>
    <rect x="0" y="0" width="220" height="220" rx="52" fill="none" stroke="#4f8ef7" stroke-width="1.5" opacity="0.25"/>
    <rect x="12" y="12" width="196" height="196" rx="42" fill="#4f8ef7" opacity="0.04"/>

    <!-- Left bracket < -->
    <path d="M72 52 L22 110 L72 168"
          stroke="url(#iconGrad)" stroke-width="16"
          stroke-linecap="round" stroke-linejoin="round"
          fill="none"/>

    <!-- Right bracket > -->
    <path d="M148 52 L198 110 L148 168"
          stroke="#60a5fa" stroke-width="16"
          stroke-linecap="round" stroke-linejoin="round"
          fill="none"/>

    <!-- Center slash / -->
    <path d="M140 62 L96 158"
          stroke="#4f8ef7" stroke-width="12"
          stroke-linecap="round" opacity="0.55"/>

    <!-- Accent dot -->
    <circle cx="200" cy="14" r="12" fill="#60a5fa" opacity="0.92"/>
    <circle cx="200" cy="14" r="6" fill="#ffffff" opacity="0.45"/>
  </g>

  <!-- ─── Brand Name ─── -->
  <!-- Safe zone: keep text centered-right, clear of bottom-left profile overlap -->
  <g filter="url(#softGlow)" transform="translate(0, 0)">
    <!-- NexaWeb large -->
    <text x="820" y="230"
          font-family="'Poppins', 'Segoe UI', Arial, sans-serif"
          font-size="110" text-anchor="middle">
      <tspan font-weight="700" fill="#f1f5f9">Nexa</tspan><tspan font-weight="700" fill="#4f8ef7">Web</tspan>
    </text>

    <!-- Services thin -->
    <text x="820" y="300"
          font-family="'Poppins', 'Segoe UI', Arial, sans-serif"
          font-size="44" font-weight="300"
          fill="#94a3b8" text-anchor="middle" letter-spacing="14">Services</text>
  </g>

  <!-- Accent underline -->
  <rect x="560" y="328" width="520" height="2.5" rx="1.25"
        fill="url(#sloganGrad)" opacity="0.45"/>

  <!-- ─── Slogan ─── -->
  <text x="820" y="390"
        font-family="'Inter', 'Segoe UI', Arial, sans-serif"
        font-size="36" font-weight="600"
        fill="url(#sloganGrad)" text-anchor="middle"
        letter-spacing="7">Build · Launch · Grow</text>

  <!-- Website URL -->
  <text x="820" y="446"
        font-family="'Inter', 'Segoe UI', Arial, sans-serif"
        font-size="24" font-weight="400"
        fill="#475569" text-anchor="middle"
        letter-spacing="2">nexawebservice.com</text>

  <!-- Bottom accent line -->
  <rect x="0" y="616" width="1640" height="8" rx="0" fill="url(#sloganGrad)" opacity="0.6"/>
</svg>
