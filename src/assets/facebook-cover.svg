<svg width="820" height="312" viewBox="0 0 820 312" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f8ef7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="820" height="312" fill="url(#bgGrad)"/>

  <!-- Orbs -->
  <circle cx="0" cy="0" r="200" fill="#4f8ef7" opacity="0.06"/>
  <circle cx="820" cy="312" r="240" fill="#4f8ef7" opacity="0.07"/>
  <circle cx="820" cy="0" r="130" fill="#60a5fa" opacity="0.04"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="104" x2="820" y2="104" stroke="#4f8ef7" stroke-width="0.5" opacity="0.07"/>
  <line x1="0" y1="208" x2="820" y2="208" stroke="#4f8ef7" stroke-width="0.5" opacity="0.07"/>
  <line x1="273" y1="0" x2="273" y2="312" stroke="#4f8ef7" stroke-width="0.5" opacity="0.07"/>
  <line x1="547" y1="0" x2="547" y2="312" stroke="#4f8ef7" stroke-width="0.5" opacity="0.07"/>

  <!-- Code icon — TOP CENTER -->
  <g transform="translate(345, 18)">
    <rect x="0" y="0" width="130" height="130" rx="30"
          fill="url(#iconBg)"/>
    <rect x="0" y="0" width="130" height="130" rx="30"
          fill="none" stroke="#4f8ef7" stroke-width="1" opacity="0.25"/>
    <!-- Left bracket -->
    <path d="M40 28 L12 65 L40 102"
          stroke="url(#iconGrad)" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Right bracket -->
    <path d="M90 28 L118 65 L90 102"
          stroke="#60a5fa" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Slash -->
    <path d="M84 36 L58 94"
          stroke="#4f8ef7" stroke-width="7"
          stroke-linecap="round" opacity="0.55"/>
    <!-- Accent dot -->
    <circle cx="120" cy="10" r="8" fill="#60a5fa" opacity="0.92"/>
    <circle cx="120" cy="10" r="4" fill="#ffffff" opacity="0.45"/>
  </g>

  <!-- Brand Name -->
  <text x="410" y="196"
        font-family="'Poppins','Segoe UI',Arial,sans-serif"
        text-anchor="middle">
    <tspan font-size="60" font-weight="700" fill="#f1f5f9">Nexa</tspan><tspan font-size="60" font-weight="700" fill="#4f8ef7">Web</tspan><tspan font-size="30" font-weight="300" fill="#94a3b8" dx="8">Service</tspan>
  </text>

  <!-- Accent underline -->
  <rect x="210" y="206" width="400" height="1.5" rx="0.75"
        fill="url(#lineGrad)" opacity="0.40"/>

  <!-- Slogan -->
  <text x="410" y="238"
        font-family="'Inter','Segoe UI',Arial,sans-serif"
        font-size="17" font-weight="600"
        text-anchor="middle" letter-spacing="4">
    <tspan fill="#94a3b8">Build · Launch · </tspan><tspan fill="#4f8ef7">Grow</tspan>
  </text>

  <!-- URL -->
  <text x="410" y="266"
        font-family="'Inter','Segoe UI',Arial,sans-serif"
        font-size="12" font-weight="400"
        fill="#334155" text-anchor="middle" letter-spacing="1.5">nexawebservice.com</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="306" width="820" height="6" rx="0" fill="url(#lineGrad)" opacity="0.55"/>
</svg>
