<svg width="1584" height="396" viewBox="0 0 1584 396" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="sloganGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f8ef7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="iconGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1584" height="396" fill="url(#bgGrad)"/>

  <!-- Subtle gradient orbs -->
  <circle cx="0" cy="0" r="300" fill="#4f8ef7" opacity="0.06"/>
  <circle cx="1584" cy="396" r="350" fill="#4f8ef7" opacity="0.07"/>
  <circle cx="1584" cy="0" r="200" fill="#60a5fa" opacity="0.04"/>
  <circle cx="792" cy="198" r="260" fill="#4f8ef7" opacity="0.025"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="132" x2="1584" y2="132" stroke="#4f8ef7" stroke-width="0.5" opacity="0.06"/>
  <line x1="0" y1="264" x2="1584" y2="264" stroke="#4f8ef7" stroke-width="0.5" opacity="0.06"/>
  <line x1="528" y1="0" x2="528" y2="396" stroke="#4f8ef7" stroke-width="0.5" opacity="0.06"/>
  <line x1="1056" y1="0" x2="1056" y2="396" stroke="#4f8ef7" stroke-width="0.5" opacity="0.06"/>

  <!-- Icon block — right side, safe from LinkedIn profile photo (bottom-left) -->
  <g transform="translate(1330, 108)" filter="url(#iconGlow)">
    <rect x="0" y="0" width="170" height="170" rx="40" fill="url(#iconBg)"/>
    <rect x="0" y="0" width="170" height="170" rx="40" fill="none" stroke="#4f8ef7" stroke-width="1.5" opacity="0.25"/>

    <!-- Left bracket < -->
    <path d="M54 38 L16 85 L54 132"
          stroke="url(#iconGrad)" stroke-width="12"
          stroke-linecap="round" stroke-linejoin="round"
          fill="none"/>

    <!-- Right bracket > -->
    <path d="M116 38 L154 85 L116 132"
          stroke="#60a5fa" stroke-width="12"
          stroke-linecap="round" stroke-linejoin="round"
          fill="none"/>

    <!-- Center slash / -->
    <path d="M110 46 L74 124"
          stroke="#4f8ef7" stroke-width="9"
          stroke-linecap="round" opacity="0.55"/>

    <!-- Accent dot -->
    <circle cx="156" cy="12" r="9" fill="#60a5fa" opacity="0.92"/>
    <circle cx="156" cy="12" r="5" fill="#ffffff" opacity="0.45"/>
  </g>

  <!-- ─── Brand Name — one line ─── -->
  <text x="730" y="172"
        font-family="'Poppins', 'Segoe UI', Arial, sans-serif"
        text-anchor="middle">
    <tspan font-size="90" font-weight="700" fill="#f1f5f9">Nexa</tspan><tspan font-size="90" font-weight="700" fill="#4f8ef7">Web</tspan><tspan font-size="46" font-weight="300" fill="#94a3b8" dx="10">Service</tspan>
  </text>

  <!-- Accent underline -->
  <rect x="420" y="196" width="620" height="2" rx="1"
        fill="url(#sloganGrad)" opacity="0.40"/>

  <!-- Slogan — smaller than Service, Grow in blue -->
  <text x="730" y="248"
        font-family="'Inter', 'Segoe UI', Arial, sans-serif"
        font-size="26" font-weight="600"
        text-anchor="middle" letter-spacing="5">
    <tspan fill="#94a3b8">Build · Launch · </tspan><tspan fill="#4f8ef7">Grow</tspan>
  </text>

  <!-- URL -->
  <text x="730" y="296"
        font-family="'Inter', 'Segoe UI', Arial, sans-serif"
        font-size="20" font-weight="400"
        fill="#334155" text-anchor="middle"
        letter-spacing="2">nexawebservice.com</text>

  <!-- Bottom accent line -->
  <rect x="0" y="389" width="1584" height="7" rx="0" fill="url(#sloganGrad)" opacity="0.6"/>
</svg>
