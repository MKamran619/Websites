<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="sloganGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="iconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#4f8ef7" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- White background -->
  <rect width="1080" height="1080" fill="#ffffff"/>

  <!-- Subtle blue gradient orbs in corners -->
  <circle cx="0" cy="0" r="380" fill="#4f8ef7" opacity="0.04"/>
  <circle cx="1080" cy="1080" r="380" fill="#4f8ef7" opacity="0.04"/>
  <circle cx="1080" cy="0" r="200" fill="#60a5fa" opacity="0.03"/>

  <!-- Icon background rounded square -->
  <rect x="390" y="195" width="300" height="300" rx="72"
        fill="#4f8ef7" opacity="0.08" filter="url(#shadow)"/>
  <rect x="390" y="195" width="300" height="300" rx="72"
        fill="none" stroke="#4f8ef7" stroke-width="1.5" opacity="0.18"/>
  <rect x="408" y="213" width="264" height="264" rx="60"
        fill="#4f8ef7" opacity="0.04"/>

  <!-- Left bracket < -->
  <path d="M455 258 L393 343 L455 428"
        stroke="url(#iconGrad)" stroke-width="22"
        stroke-linecap="round" stroke-linejoin="round"
        fill="none" filter="url(#iconGlow)"/>

  <!-- Right bracket > -->
  <path d="M625 258 L687 343 L625 428"
        stroke="#60a5fa" stroke-width="22"
        stroke-linecap="round" stroke-linejoin="round"
        fill="none"/>

  <!-- Center slash / -->
  <path d="M610 272 L550 414"
        stroke="#4f8ef7" stroke-width="17"
        stroke-linecap="round" opacity="0.55"/>

  <!-- Accent dot top-right -->
  <circle cx="684" cy="202" r="15" fill="#60a5fa" opacity="0.92"/>
  <circle cx="684" cy="202" r="8" fill="#ffffff" opacity="0.5"/>

  <!-- ─── Brand Name ─── -->
  <!-- "Nexa" dark + "Web" blue — same styling as website header -->
  <text x="540" y="638"
        font-family="'Poppins', 'Segoe UI', Arial, sans-serif"
        font-size="92" text-anchor="middle">
    <tspan font-weight="700" fill="#1a202c">Nexa</tspan><tspan font-weight="700" fill="#4f8ef7">Web</tspan>
  </text>

  <!-- "Services" thin gray — same as header -->
  <text x="540" y="708"
        font-family="'Poppins', 'Segoe UI', Arial, sans-serif"
        font-size="38" font-weight="300"
        fill="#94a3b8" text-anchor="middle" letter-spacing="8">Services</text>

  <!-- Accent underline -->
  <rect x="360" y="738" width="360" height="2.5" rx="1.25"
        fill="url(#sloganGrad)" opacity="0.30"/>

  <!-- ─── Slogan ─── -->
  <text x="540" y="808"
        font-family="'Inter', 'Segoe UI', Arial, sans-serif"
        font-size="31" font-weight="600"
        fill="url(#sloganGrad)" text-anchor="middle"
        letter-spacing="5">Build · Launch · Grow</text>

  <!-- Website URL subtle -->
  <text x="540" y="868"
        font-family="'Inter', 'Segoe UI', Arial, sans-serif"
        font-size="22" font-weight="400"
        fill="#cbd5e1" text-anchor="middle"
        letter-spacing="1">nexawebservice.com</text>
</svg>
