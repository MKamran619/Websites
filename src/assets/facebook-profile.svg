<svg width="360" height="360" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8faff"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="sloganGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <!-- White background -->
  <rect width="360" height="360" fill="url(#bg)"/>

  <!-- Subtle corner orbs -->
  <circle cx="0" cy="0" r="120" fill="#4f8ef7" opacity="0.04"/>
  <circle cx="360" cy="360" r="120" fill="#4f8ef7" opacity="0.04"/>

  <!-- Icon background box -->
  <rect x="118" y="42" width="124" height="124" rx="28"
        fill="#4f8ef7" opacity="0.07"/>
  <rect x="118" y="42" width="124" height="124" rx="28"
        fill="none" stroke="#4f8ef7" stroke-width="1" opacity="0.18"/>

  <!-- Left bracket < -->
  <path d="M148 70 L114 104 L148 138"
        stroke="url(#iconGrad)" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Right bracket > -->
  <path d="M212 70 L246 104 L212 138"
        stroke="#60a5fa" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Center slash / -->
  <path d="M206 76 L180 132"
        stroke="#4f8ef7" stroke-width="7"
        stroke-linecap="round" opacity="0.50"/>

  <!-- Accent dot -->
  <circle cx="244" cy="48" r="6" fill="#60a5fa" opacity="0.92"/>
  <circle cx="244" cy="48" r="3" fill="#ffffff" opacity="0.6"/>

  <!-- Brand Name -->
  <text x="180" y="218"
        font-family="'Poppins','Segoe UI',Arial,sans-serif"
        text-anchor="middle">
    <tspan font-size="36" font-weight="700" fill="#1a202c">Nexa</tspan><tspan font-size="36" font-weight="700" fill="#4f8ef7">Web</tspan>
  </text>
  <text x="180" y="246"
        font-family="'Poppins','Segoe UI',Arial,sans-serif"
        font-size="15" font-weight="300" fill="#94a3b8"
        text-anchor="middle" letter-spacing="2">Service</text>

  <!-- Accent underline -->
  <rect x="90" y="255" width="180" height="1.5" rx="0.75"
        fill="url(#sloganGrad)" opacity="0.30"/>

  <!-- Slogan -->
  <text x="180" y="283"
        font-family="'Inter','Segoe UI',Arial,sans-serif"
        font-size="11" font-weight="600"
        text-anchor="middle" letter-spacing="2.5">
    <tspan fill="#64748b">Build · Launch · </tspan><tspan fill="#4f8ef7">Grow</tspan>
  </text>

  <!-- URL -->
  <text x="180" y="308"
        font-family="'Inter','Segoe UI',Arial,sans-serif"
        font-size="9" font-weight="400"
        fill="#cbd5e1" text-anchor="middle" letter-spacing="0.5">nexawebservice.com</text>
</svg>
