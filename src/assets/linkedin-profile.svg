<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="sloganGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="iconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#4f8ef7" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- White background -->
  <rect width="1080" height="1080" fill="#ffffff"/>

  <!-- Subtle blue orbs -->
  <circle cx="0" cy="0" r="380" fill="#4f8ef7" opacity="0.04"/>
  <circle cx="1080" cy="1080" r="380" fill="#4f8ef7" opacity="0.04"/>
  <circle cx="1080" cy="0" r="200" fill="#60a5fa" opacity="0.03"/>

  <!-- Icon background -->
  <rect x="390" y="160" width="300" height="300" rx="72"
        fill="#4f8ef7" opacity="0.07" filter="url(#shadow)"/>
  <rect x="390" y="160" width="300" height="300" rx="72"
        fill="none" stroke="#4f8ef7" stroke-width="1.5" opacity="0.15"/>
  <rect x="408" y="178" width="264" height="264" rx="60"
        fill="#4f8ef7" opacity="0.03"/>

  <!-- Left bracket < -->
  <path d="M455 223 L393 310 L455 397"
        stroke="url(#iconGrad)" stroke-width="22"
        stroke-linecap="round" stroke-linejoin="round"
        fill="none" filter="url(#iconGlow)"/>

  <!-- Right bracket > -->
  <path d="M625 223 L687 310 L625 397"
        stroke="#60a5fa" stroke-width="22"
        stroke-linecap="round" stroke-linejoin="round"
        fill="none"/>

  <!-- Center slash / -->
  <path d="M610 237 L550 383"
        stroke="#4f8ef7" stroke-width="17"
        stroke-linecap="round" opacity="0.50"/>

  <!-- Accent dot -->
  <circle cx="684" cy="167" r="15" fill="#60a5fa" opacity="0.92"/>
  <circle cx="684" cy="167" r="8" fill="#ffffff" opacity="0.5"/>

  <!-- ─── Brand Name — one line ─── -->
  <text x="540" y="600"
        font-family="'Poppins', 'Segoe UI', Arial, sans-serif"
        text-anchor="middle">
    <tspan font-size="84" font-weight="700" fill="#1a202c">Nexa</tspan><tspan font-size="84" font-weight="700" fill="#4f8ef7">Web</tspan><tspan font-size="44" font-weight="300" fill="#94a3b8" dx="10">Service</tspan>
  </text>

  <!-- Accent underline -->
  <rect x="300" y="628" width="480" height="2.5" rx="1.25"
        fill="url(#sloganGrad)" opacity="0.30"/>

  <!-- Slogan — smaller than Service, Grow in blue -->
  <text x="540" y="692"
        font-family="'Inter', 'Segoe UI', Arial, sans-serif"
        font-size="26" font-weight="600"
        text-anchor="middle" letter-spacing="4">
    <tspan fill="#64748b">Build · Launch · </tspan><tspan fill="#4f8ef7">Grow</tspan>
  </text>

  <!-- URL -->
  <text x="540" y="748"
        font-family="'Inter', 'Segoe UI', Arial, sans-serif"
        font-size="20" font-weight="400"
        fill="#cbd5e1" text-anchor="middle"
        letter-spacing="1">nexawebservice.com</text>
</svg>
