    <!-- Analytics loader functions (do not run until consent) -->
    <script>
      function loadFacebookPixel(pixelId) {
        if (!pixelId) return;
        if (window.fbq) {
          try {
            window.fbq("init", pixelId);
            window.fbq("track", "PageView");
          } catch (e) {}
          return;
        }
        !(function (f, b, e, v, n, t, s) {
          if (f.fbq) return;
          n = f.fbq = function () {
            n.callMethod
              ? n.callMethod.apply(n, arguments)
              : n.queue.push(arguments);
          };
          if (!f._fbq) f._fbq = n;
          n.push = n;
          n.loaded = !0;
          n.version = "2.0";
          n.queue = [];
          t = b.createElement(e);
          t.async = !0;
          t.src = v;
          s = b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t, s);
        })(
          window,
          document,
          "script",
          "https://connect.facebook.net/en_US/fbevents.js",
        );
        try {
          fbq("init", pixelId);
          fbq("track", "PageView");
        } catch (e) {
          console.warn("fbq init failed", e);
        }
      }

      function loadGA4(measurementId) {
        if (!measurementId) return;
        if (window.gtag) {
          try {
            gtag("config", measurementId);
          } catch (e) {}
          return;
        }
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=" + measurementId;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag() {
          dataLayer.push(arguments);
        }
        window.gtag = gtag;
        gtag("js", new Date());
        gtag("config", measurementId);
      }

      // Consent banner logic
      (function () {
        function createBanner() {
          if (document.getElementById("cookie-consent-banner")) return;
          var div = document.createElement("div");
          div.id = "cookie-consent-banner";
          div.style =
            "position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.85); color: #fff; padding: 14px; text-align: center; z-index: 99999; font-family: Arial, sans-serif;";
          var privacy =
            document
              .querySelector('meta[name="privacy-policy"]')
              ?.getAttribute("content") || "";
          var privacyLink = privacy
            ? ' <a href="' +
              privacy +
              '" target="_blank" rel="noopener" style="color:#9ae6b4;margin-left:8px;text-decoration:underline;">Privacy Policy</a>'
            : "";
          div.innerHTML =
            '<span id="cookie-text">We use cookies and tracking (Google Analytics &amp; Meta Pixel) to improve site experience and measure campaign performance.' +
            privacyLink +
            "</span>" +
            '<button id="cookie-accept" style="margin-left:12px;padding:8px 14px;background:#1d4ed8;color:#fff;border:none;border-radius:6px;cursor:pointer;">Accept</button>' +
            '<button id="cookie-decline" style="margin-left:8px;padding:8px 14px;background:#374151;color:#fff;border:none;border-radius:6px;cursor:pointer;">Decline</button>';
          document.body.appendChild(div);
          document
            .getElementById("cookie-accept")
            .addEventListener("click", function () {
              localStorage.setItem("cookieConsent", "granted");
              initAnalyticsFromMeta();
              div.style.display = "none";
            });
          document
            .getElementById("cookie-decline")
            .addEventListener("click", function () {
              localStorage.setItem("cookieConsent", "denied");
              div.style.display = "none";
            });
        }

        function initAnalyticsFromMeta() {
          var pixel = document
            .querySelector('meta[name="meta-pixel-id"]')
            ?.getAttribute("content");
          var ga = document
            .querySelector('meta[name="ga4-id"]')
            ?.getAttribute("content");
          if (pixel && pixel !== "YOUR_PIXEL_ID") loadFacebookPixel(pixel);
          if (ga && ga !== "G-XXXXXXXXXX") loadGA4(ga);
        }

        if (
          document.readyState === "complete" ||
          document.readyState === "interactive"
        ) {
          if (localStorage.getItem("cookieConsent") === "granted") {
            initAnalyticsFromMeta();
          } else if (localStorage.getItem("cookieConsent") !== "denied") {
            createBanner();
          }
        } else {
          document.addEventListener("DOMContentLoaded", function () {
            if (localStorage.getItem("cookieConsent") === "granted") {
              initAnalyticsFromMeta();
            } else if (localStorage.getItem("cookieConsent") !== "denied") {
              createBanner();
            }
          });
        }

        // Expose a small test helper so you can trigger a Lead event from the console
        try {
          window.simulateLeadEvent = function () {
            try {
              var pixel = document
                .querySelector('meta[name="meta-pixel-id"]')
                ?.getAttribute("content");
              var ga = document
                .querySelector('meta[name="ga4-id"]')
                ?.getAttribute("content");
              if (pixel && window.fbq) {
                try {
                  fbq("track", "Lead");
                  console.log("fbq Lead fired");
                } catch (e) {
                  console.warn("fbq not ready", e);
                }
              } else {
                console.warn("fbq or pixel id not available");
              }
              if (ga && window.gtag) {
                try {
                  gtag("event", "conversion", {
                    event_category: "contact",
                    event_label: "simulate_lead",
                    value: 1,
                  });
                  console.log("gtag conversion fired");
                } catch (e) {
                  console.warn("gtag not ready", e);
                }
              } else {
                console.warn("gtag or ga id not available");
              }
            } catch (ex) {
              console.warn("simulateLeadEvent error", ex);
            }
          };
        } catch (ex) {
          /* noop */
        }
      })();

    <script>
      if (!window.simulateLeadEvent) {
        window.simulateLeadEvent = function () {
          console.warn('simulateLeadEvent helper not available or analytics not initialized.');
        };
      }
    </script>
